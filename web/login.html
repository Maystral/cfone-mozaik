<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOne · Log in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth">
<main class="auth-card">
  <h1>CFOne</h1>
  <p class="tag">See everything you have, owe and have promised, and fix problems before they happen.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-login" aria-selected="true">Log in</button>
    <button role="tab" id="tab-register" aria-selected="false">Create account</button>
  </div>
  <form id="form" autocomplete="on">
    <label>Username <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+"></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required minlength="4"></label>
    <button type="submit" class="primary" id="submit">Log in</button>
    <p id="error" class="error" role="alert"></p>
  </form>
  <button id="demo" class="demo">Try the demo: log in as <b>demo</b> / <b>demo</b></button>
  <p class="fine">Synthetic data only: fictional banks and people. Not financial advice.</p>
</main>
<script src="/login.js" type="module"></script>
</body>
</html>
