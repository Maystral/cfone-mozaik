name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Offline demo
        run: npm run demo
        env:
          CFONE_OFFLINE: "1"
          CFONE_OFFLINE_LATENCY_MS: "50"
